# Dependabot version updates: monthly, grouped, labeled (fewer PRs, fewer CI runs).
# Security updates are switched on separately (Settings → Code security →
# Dependabot security updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels: [dependencies, "area: engine"]
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The PhotoCraft engine crates are pinned on purpose to one audited rev
      # (docs/artcraft-bridge/PHOTOCRAFT-PIN.md). Bump them by hand.
      - dependency-name: "photocraft-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Almaty
    labels: [dependencies, "area: ci"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels: [dependencies, "area: android"]
    commit-message:
      prefix: "deps(gradle)"
    groups:
      android-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Android toolchain bumps need one coordinated migration (#46):
      # AGP 9 (built-in Kotlin, new DSL), Kotlin 2.4, compileSdk 36 for newer
      # AndroidX / Compose. Patch updates still flow. Drop these with #46.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
