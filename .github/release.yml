# Categories for GitHub's auto-generated release notes
# (Releases → Draft a new release → Generate release notes).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "🚀 Features"
      labels: [enhancement]
    - title: "🐛 Fixes"
      labels: [bug]
    - title: "🔒 Security"
      labels: [security]
    - title: "🔬 Research"
      labels: [research]
    - title: "📚 Documentation"
      labels: [documentation, "area: docs"]
    - title: "📦 Dependencies"
      labels: [dependencies]
    - title: "Other changes"
      labels: ["*"]
