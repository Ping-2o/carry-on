# Supply chain: RustSec advisories, license allow-list, banned and unknown
# sources (deny.toml). Runs when dependencies change, plus weekly so new
# advisories against an unchanged Cargo.lock still surface.
name: Supply chain (cargo-deny)

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/deny.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/deny.yml"]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A freshly published advisory must not turn unrelated PRs red; it shows
    # up in this job (and in the weekly run) instead.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --workspace
