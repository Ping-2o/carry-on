# Labels PRs by the paths they touch (.github/labeler.yml). Uses
# pull_request_target so fork PRs can be labeled too; it never checks out or
# runs PR code.
name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v6
