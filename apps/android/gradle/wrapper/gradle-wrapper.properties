# Carry-On for Android — Gradle wrapper.
# gradlew/gradlew.bat + wrapper jar sourced from the local kiwix-android checkout
# (see README "Toolchain"); distributionUrl pinned to a Gradle release compatible
# with AGP 8.7.3 (AGP 8.7 requires Gradle >= 8.9).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
